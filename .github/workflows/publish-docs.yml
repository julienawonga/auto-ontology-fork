# Renders the documentation with MkDocs and the OpenAPI spec with Redoc, then publishes both to GitHub Pages.
#
# BEFORE THIS CAN RUN: Settings → Pages → Source must be set to "GitHub
# Actions". Until then this job fails; the deploy step is what needs it.
#
# ON VISIBILITY: a Pages site is only private on GitHub Enterprise Cloud with
# private Pages enabled. Anywhere else the published site — including the API
# surface and the permission each operation requires — is world-readable.

name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race; drop queued runs rather than deploying stale
# docs, but let an in-flight one finish so Pages is not left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install "mkdocs-material~=9.6"

      - name: Build documentation
        run: mkdocs build --site-dir site

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build the Redoc site
        env:
          REDOCLY_TELEMETRY: off
        # Pinned to v1: `build-docs` was removed in v2.
        run: npx --yes @redocly/cli@1 build-docs docs/openapi/auto-ontology-api.json -o site/api/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
