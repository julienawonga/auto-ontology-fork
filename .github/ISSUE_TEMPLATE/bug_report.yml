name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Ask …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. main @ 51e65dd
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat / answers
        - Semantic compilation / ontology
        - Connections / ingestion
        - UI
        - MCP / REST API
        - Deployment (Docker, Helm)
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or personal data first.
