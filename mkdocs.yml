site_name: Lexis
site_description: Lexis reads your schemas, builds a business ontology on top of them, and lets people and AI agents query your data in plain language, with the SQL, the steps and the definitions behind every answer.
repo_url: https://github.com/julienawonga/lexis
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Getting started:
      - Configuration: configuration.md
      - Connections and credential storage: connections.md
      - Source-database connections: source-connections.md
      - Authentication, SSO, and API tokens: authentication.md
  - Using Lexis:
      - Conversation API: conversation-api.md
      - Business Terms API: terms-api.md
      - Lexis MCP server: mcp.md
      - Matching question wording to stored values: value-linking.md
  - Engine & safety:
      - Safety of agent-issued SQL: query-safety.md
      - Evaluating the text-to-SQL engine: evaluation.md
      - Experiments log: experiments.md
  - API reference: api/
  - Project:
      - Verification status: verification-status.md
      - Design:
          - "Design: a self-improving ontology for Lexis": design/self-improving-ontology.md

# api/ is produced by Redoc after the build
validation:
  nav:
    not_found: info
    omitted_files: info
  links:
    unrecognized_links: info
