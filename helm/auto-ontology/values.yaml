# Default values for the Lexis Helm chart.

# Global image pull policy. With minikube + locally-built images,
# IfNotPresent prevents the cluster from trying to pull from a remote registry.
imagePullPolicy: IfNotPresent

# Image pull secrets for private registries. Empty by default: the published
# GHCR images are public. To pull from a private registry, create a
# docker-registry Secret and list it, e.g.:
#   imagePullSecrets:
#     - name: registry-creds
imagePullSecrets: []

# When enabled, the chart renders an in-cluster Secret (<release>-secrets) from
# the values below — convenient for local / minikube. Disable it when an
# external mechanism (e.g. the External Secrets Operator) supplies that Secret.
bundledSecret:
  enabled: true

# Extra annotations merged into the backend / ingestion / frontend pod templates.
# A GitOps overlay can bump a value here (e.g. rolledAt) to force a fresh rollout
# even when image references are unchanged.
podAnnotations: {}

# ------------------------------------------------------------------
# Shared credentials — populate a single k8s Secret (<release>-secrets)
# consumed by all Lexis workloads.
# ------------------------------------------------------------------
# Postgres
postgresUser: auto_ontology
postgresPassword: ""
postgresDatabase: auto_ontology
# pgAdmin
pgadminEmail: admin@example.com
pgadminPassword: admin
# Models — default triplet for any OpenAI-compatible endpoint. Every model
# triplet (reasoning / non-reasoning / embed / rerank) falls back to these per
# field. See docs/configuration.md for the per-model overrides.
defaultModelsApiKey: ""
defaultModelsEndpoint: ""
defaultModelsModel: ""
# KumoRFM (predictions). Set the URL to an endpoint serving the 'kumo-rfm'
# model; leave it empty to disable the prediction tool. The key is only needed
# when that endpoint sits behind an authenticating gateway.
kumoRfmApiKey: ""
kumoRfmApiUrl: ""
# Per-role overrides. Leave a field empty to inherit it from the default
# triplet above. There is no built-in endpoint or model: a role whose model
# resolves to empty refuses to start and names the setting to fill in.
reasoningModel: ""
nonReasoningModel: ""
embedEndpoint: ""
embedModel: ""
rerankEndpoint: ""
rerankModel: ""
# Width of the embedding vectors (empty = 2048). Must match embedModel.
embedDimensions: ""
# Set to "false" when the embedding endpoint rejects the extra body fields
# (input_type, truncate, modality), as most OpenAI-compatible gateways do.
embedExtraFields: ""
# Ingestion targets - comma-separated list of PG URLs the worker reads from.
connectionStrings: ""
# HashiCorp Vault (AppRole) credentials for pulling secrets at runtime.
vaultAddr: ""
vaultNamespace: ""
vaultRoleId: ""
vaultSecretId: ""
# Optional Vault mount overrides (defaults shown).
vaultAuthMount: "approle"
vaultKvMount: "auto-ontology"
# Better Auth signing key (sessions, CSRF, OIDC state). Leave empty to
# auto-generate a stable random secret on first install and preserve it across
# upgrades. Set explicitly to share one value across environments/replicas.
authSecret: ""
# Shared secret the web app presents to the API and the ingestion service, which
# refuse any request without it (and only then trust the forwarded user identity).
# Leave empty to auto-generate one on first install, preserved across upgrades;
# set explicitly (at least 32 characters) to share one value across environments.
internalApiToken: ""
# Public origin of the app — REQUIRED by Better Auth (sessions, CSRF, OIDC
# redirect URIs). It must match the URL you actually browse to, or auth
# requests 404 / fail CSRF. The default works when reaching the frontend via
# `kubectl port-forward svc/frontend 3000:3000`. For NodePort/ingress/https,
# set this to that exact origin (e.g. https://auto-ontology.example.com).
appUrl: "http://localhost:3000"
# Public origin of the separately deployed MCP server, without its `/mcp`
# endpoint suffix. OAuth access tokens are audience-bound to this URL.
mcpPublicUrl: "http://localhost:3003"
# Bootstrap admin account. REQUIRED — self-service sign-up is disabled, so this
# is the only way the initial admin is provisioned. The frontend creates this
# admin on first start (email-verified), or resets its password to this value
# on subsequent starts. Leaving either empty fails the install/upgrade.
adminEmail: ""
adminPassword: ""

# ------------------------------------------------------------------
# Postgres (pgvector)
# ------------------------------------------------------------------
postgres:
  image:
    repository: pgvector/pgvector
    tag: pg17
  service:
    port: 5432
  persistence:
    size: 5Gi
    # Set to a specific class on clusters without a default dynamic provisioner
    # Empty = cluster default.
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# ------------------------------------------------------------------
# pgAdmin
# ------------------------------------------------------------------
pgadmin:
  # Optional DB admin UI. Handy for local/minikube; disable it in shared
  # environments (pgadmin.enabled=false).
  enabled: true
  image:
    repository: dpage/pgadmin4
    tag: latest
  service:
    port: 80
    nodePort: 30050
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# ------------------------------------------------------------------
# Lexis FastAPI backend
# ------------------------------------------------------------------
backend:
  # The Alembic head revision this chart's image ships. The backend's
  # wait-for-catalog-schema init container blocks until public.alembic_version
  # matches it, so new Pods never serve against a schema the migration Job has
  # not finished applying. Bump this with the migration, in the same commit.
  alembicRevision: 99d4d343dd0b
  # Published by .github/workflows/release.yml. The chart that workflow
  # pushes has every tag below set to its own release version.
  image:
    repository: ghcr.io/julienawonga/auto-ontology
    tag: "1.2.0"
    # digest: ""  # e.g. sha256:...; overrides tag when set (immutable pin)
  service:
    port: 3001
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# ------------------------------------------------------------------
# Ingestion worker (exposes an HTTP API the backend calls to trigger ingest)
# ------------------------------------------------------------------
ingestion:
  image:
    # Reuses the backend image with a different entrypoint arg.
    repository: ghcr.io/julienawonga/auto-ontology
    tag: "1.2.0"
    # digest: ""  # e.g. sha256:...; overrides tag when set (immutable pin)
  service:
    port: 3002
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# ------------------------------------------------------------------
# Next.js frontend
# ------------------------------------------------------------------
frontend:
  image:
    repository: ghcr.io/julienawonga/auto-ontology-frontend
    tag: "1.2.0"
    # digest: ""  # e.g. sha256:...; overrides tag when set (immutable pin)
  service:
    port: 3000
    nodePort: 30000
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
